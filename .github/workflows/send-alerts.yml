name: Send alerts
on:
  push:
    branches: [main]
    paths: ['_alerts/alerts.json']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: send-alerts
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Anything due?
        id: due
        run: node _alerts/send-alerts.mjs --check
      - uses: actions/setup-node@v4
        if: steps.due.outputs.due == 'yes'
        with:
          node-version: 20
      - name: Install web-push
        if: steps.due.outputs.due == 'yes'
        run: npm install --no-save --no-audit --no-fund web-push@3.6.7
      - name: Send
        if: steps.due.outputs.due == 'yes'
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
        run: node _alerts/send-alerts.mjs
      - name: Save results
        if: steps.due.outputs.due == 'yes'
        run: |
          git config user.name "Darby alerts"
          git config user.email "alerts@users.noreply.github.com"
          git add _alerts/alerts.json
          git diff --cached --quiet && exit 0
          git commit -m "Alerts sent"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
