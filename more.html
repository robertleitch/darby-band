<title>Hilliard Darby Marching Band</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#15233b;--muted:#5b6b82;--line:#d9e0ea;--navy:#0d2240;--accent:#8bb8e8;--brass:#2f6fae;--good:#2f7d4f;
--display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Source Sans 3","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--panel:#152131;--ink:#e7edf5;--muted:#9aaabf;--line:#26364b;--navy:#0a1a31;--brass:#8bb8e8;--good:#3f9a65;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1622;--panel:#152131;--ink:#e7edf5;--muted:#9aaabf;--line:#26364b;--navy:#0a1a31;--brass:#8bb8e8;--good:#3f9a65;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:16px}
.bar{background:var(--navy);color:#fff;border-radius:6px;border-bottom:4px solid var(--accent);padding:14px 18px;display:flex;align-items:center;gap:14px}
.bar img{height:48px}.bar h1{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.02em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 18px}
.card h2{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;line-height:1.1}
.card p{margin:4px 0 16px;color:var(--muted);font-size:.95rem}
label{display:block;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:1.05rem;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input[type=password]:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:.92rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.chk input{width:18px;height:18px;accent-color:var(--brass)}
button{width:100%;font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase;background:var(--navy);color:#fff;border:0;border-bottom:3px solid var(--accent);border-radius:8px;padding:12px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:#b3261e;font-size:.92rem;min-height:1.3em;margin:10px 0 0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
.back{color:var(--brass);font-weight:600;text-decoration:none;font-size:.95rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
